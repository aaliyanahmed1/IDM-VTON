<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDM-VTON Virtual Try-On</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
        }
        .upload-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        .upload-box {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            background: #f8f9ff;
            transition: all 0.3s;
        }
        .upload-box:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }
        .upload-box h3 {
            color: #667eea;
            margin-bottom: 15px;
        }
        input[type="file"] {
            margin: 10px 0;
            padding: 10px;
            width: 100%;
        }
        .preview {
            margin-top: 15px;
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .controls {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
        }
        .control-group {
            margin: 15px 0;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
        }
        input[type="range"], input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-right: 10px;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.02);
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .result-section {
            margin-top: 30px;
            display: none;
        }
        .result-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 20px;
        }
        .result-box {
            text-align: center;
        }
        .result-box img {
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .result-box h4 {
            margin-top: 10px;
            color: #333;
        }
        .loading {
            text-align: center;
            padding: 40px;
            display: none;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            display: none;
        }
        .success {
            background: #efe;
            color: #3c3;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 IDM-VTON Virtual Try-On</h1>
        
        <div class="upload-section">
            <div class="upload-box">
                <h3>Person Image</h3>
                <input type="file" id="personFile" accept="image/*">
                <img id="personPreview" class="preview" style="display: none;">
            </div>
            <div class="upload-box">
                <h3>Garment Image</h3>
                <input type="file" id="garmentFile" accept="image/*">
                <img id="garmentPreview" class="preview" style="display: none;">
            </div>
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="denoiseSteps">Denoise Steps: <span id="denoiseValue">20</span></label>
                <input type="range" id="denoiseSteps" min="10" max="50" value="20">
            </div>
            <div class="control-group">
                <label>
                    <input type="checkbox" id="autoMask" checked> Auto Mask
                </label>
            </div>
            <div class="control-group">
                <label>
                    <input type="checkbox" id="cropImage"> Crop Image
                </label>
            </div>
            <div class="control-group">
                <label for="garmentDesc">Garment Description (optional):</label>
                <input type="text" id="garmentDesc" placeholder="e.g., red t-shirt">
            </div>
        </div>

        <button id="generateBtn" onclick="generateTryOn()">Generate Try-On</button>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Processing... This may take 15-25 seconds</p>
        </div>

        <div class="error" id="error"></div>
        <div class="success" id="success"></div>

        <div class="result-section" id="resultSection">
            <h2>Result</h2>
            <div class="result-grid">
                <div class="result-box">
                    <img id="resultPerson" alt="Person">
                    <h4>Person</h4>
                </div>
                <div class="result-box">
                    <img id="resultGarment" alt="Garment">
                    <h4>Garment</h4>
                </div>
                <div class="result-box">
                    <img id="resultImage" alt="Result">
                    <h4>Try-On Result</h4>
                </div>
            </div>
            <button onclick="downloadResult()" style="margin-top: 20px;">Download Result</button>
        </div>
    </div>

    <script>
        let resultImageBase64 = '';

        // Update denoise steps value
        document.getElementById('denoiseSteps').addEventListener('input', function(e) {
            document.getElementById('denoiseValue').textContent = e.target.value;
        });

        // Preview images
        document.getElementById('personFile').addEventListener('change', function(e) {
            previewImage(e.target.files[0], 'personPreview');
        });

        document.getElementById('garmentFile').addEventListener('change', function(e) {
            previewImage(e.target.files[0], 'garmentPreview');
        });

        function previewImage(file, previewId) {
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.getElementById(previewId);
                    img.src = e.target.result;
                    img.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        async function generateTryOn() {
            const personFile = document.getElementById('personFile').files[0];
            const garmentFile = document.getElementById('garmentFile').files[0];

            if (!personFile || !garmentFile) {
                showError('Please upload both person and garment images');
                return;
            }

            // Show loading
            document.getElementById('loading').style.display = 'block';
            document.getElementById('error').style.display = 'none';
            document.getElementById('success').style.display = 'none';
            document.getElementById('resultSection').style.display = 'none';
            document.getElementById('generateBtn').disabled = true;

            try {
                const formData = new FormData();
                formData.append('person_image', personFile);
                formData.append('garment_image', garmentFile);
                formData.append('denoise_steps', document.getElementById('denoiseSteps').value);
                formData.append('auto_mask', document.getElementById('autoMask').checked);
                formData.append('crop_image', document.getElementById('cropImage').checked);
                
                const garmentDesc = document.getElementById('garmentDesc').value;
                if (garmentDesc) {
                    formData.append('garment_description', garmentDesc);
                }

                const response = await fetch('/api/v1/tryon', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (result.success) {
                    resultImageBase64 = result.result_image;
                    
                    // Display results
                    document.getElementById('resultPerson').src = URL.createObjectURL(personFile);
                    document.getElementById('resultGarment').src = URL.createObjectURL(garmentFile);
                    document.getElementById('resultImage').src = `data:image/png;base64,${result.result_image}`;
                    document.getElementById('resultSection').style.display = 'block';
                    document.getElementById('success').textContent = '✅ Try-on completed successfully!';
                    document.getElementById('success').style.display = 'block';
                } else {
                    showError(result.message || 'Generation failed');
                }
            } catch (error) {
                showError('Error: ' + error.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('generateBtn').disabled = false;
            }
        }

        function showError(message) {
            document.getElementById('error').textContent = message;
            document.getElementById('error').style.display = 'block';
        }

        function downloadResult() {
            if (resultImageBase64) {
                const link = document.createElement('a');
                link.href = `data:image/png;base64,${resultImageBase64}`;
                link.download = 'tryon_result.png';
                link.click();
            }
        }
    </script>
</body>
</html>
