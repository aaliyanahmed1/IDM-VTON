version: '3.8'

services:
  idm-vton-api:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: idm-vton-api
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=all
      - PYTHONUNBUFFERED=1
    volumes:
      - ./ckpt:/app/ckpt
      - ./results:/app/results
      - ./hf_cache:/root/.cache/huggingface  # Mount HuggingFace cache externally
    restart: unless-stopped
    stdin_open: true
    tty: true

